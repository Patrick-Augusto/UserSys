<!-- src/app/pages/home/components/file-list/file-list.component.html -->
<div class="container mt-4">
    <h1>Lista de Arquivos</h1>
    <table class="table table-striped table-bordered">
      <thead class="thead-dark">
        <tr>
          <th>Nome do Arquivo</th>
          <th>Usuário</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let file of files">
          <td>{{ file.nomeArquivo }}</td>
          <td>{{ file.nomeUsuario }}</td>
          <td>
            <button (click)="download(file.id, file.nomeArquivo)" class="btn btn-primary">Baixar</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
